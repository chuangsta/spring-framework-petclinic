name: Droid Auto Review

on:
  pull_request:
    # Re-review fixes and new commits, not only the initial PR diff.
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # Draft runs skip the job but still join the group; keeping them in a separate
  # group stops a delayed draft run from cancelling a ready_for_review run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test review verification
        run: node --test .github/scripts/verify-droid-review.test.cjs
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          allowed_bots: factory-droid
      - name: Verify review was generated and delivered
        uses: actions/github-script@v8
        env:
          DROID_REVIEW_RESULTS: ${{ runner.temp }}/droid-prompts/review_post_results.json
        with:
          script: |
            const { verifyReview } = require('./.github/scripts/verify-droid-review.cjs');
            await verifyReview({
              github,
              context,
              resultsPath: process.env.DROID_REVIEW_RESULTS
            });
            core.info('Verified completed Droid review and PR comment for this run.');
